{% extends "base.html" %}
{% block titulo %}Primeiro acesso — Trombadário{% endblock %}

{% block conteudo %}
<div class="centro">
  <h1>Trombadário</h1>
  <p class="intro">
    Este servidor ainda não foi configurado. Crie a conta do pai — é ela que
    cadastra tudo e gerencia as contas dos filhos.
  </p>

  <form method="post" action="/setup">
    <label for="username">Usuário</label>
    <input type="text" id="username" name="username" value="{{ username or '' }}"
           autocomplete="username" required minlength="3" autofocus>

    <label for="display_name">Nome</label>
    <input type="text" id="display_name" name="display_name" value="{{ display_name or 'Pai' }}"
           required>

    <label for="password">Senha</label>
    <input type="password" id="password" name="password"
           autocomplete="new-password" required minlength="6">

    <label for="password_confirm">Repita a senha</label>
    <input type="password" id="password_confirm" name="password_confirm"
           autocomplete="new-password" required minlength="6">

    {% if error %}<p class="erro">{{ error }}</p>{% endif %}

    <button type="submit">Criar conta e começar</button>
  </form>
</div>
{% endblock %}
