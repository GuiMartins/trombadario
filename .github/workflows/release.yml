name: Release

# Runs whenever main advances (i.e. a release/* or hotfix/* PR just merged).
# main only moves via those PRs and is protected with required status checks,
# so a commit landing here has already passed CI - this workflow doesn't
# re-gate on that, it just versions and ships it.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Semantic version bump from Conventional Commits: `feat:` -> minor,
      # `fix:` -> patch, `BREAKING CHANGE` (anywhere in the body) -> major.
      # No recognized prefix falls back to default_bump (patch).
      # Since every merge into main is a squash, the *PR title* is the commit
      # message this reads - see CLAUDE.md.
      - name: Bump version and create tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          tag_prefix: v

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Decoded into a temp file for this run only - never written to the repo,
      # never logged. See CLAUDE.md for how to generate and rotate it.
      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.jks

      # Signed + minified (R8). signingConfigs in app/build.gradle.kts only
      # activates when RELEASE_STORE_FILE is set, so local builds never try.
      - name: Build release APK
        working-directory: android
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Delete decoded keystore
        if: always()
        run: rm -f release.jks

      # Gradle's own output name (app-release.apk) doesn't say what app or
      # version it is - rename so the release asset is self-describing.
      - name: Rename APK for the release asset
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/trombadario-${{ steps.tag_version.outputs.new_tag }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          files: dist/trombadario-${{ steps.tag_version.outputs.new_tag }}.apk
