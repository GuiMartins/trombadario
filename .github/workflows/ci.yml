name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      android-code: ${{ steps.filter.outputs.android-code }}
      backend-code: ${{ steps.filter.outputs.backend-code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            android-code:
              - 'android/**'
              - '.github/workflows/ci.yml'
            backend-code:
              - 'backend/**'
              - '.github/workflows/ci.yml'

  backend-tests:
    name: Backend (ruff + pytest)
    needs: changes
    if: needs.changes.outputs.backend-code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Run tests
        working-directory: backend
        run: pytest -q

  unit-tests:
    name: JVM unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run JVM unit tests (ServerUrl, DateFormat)
        working-directory: android
        run: ./gradlew testDebugUnitTest

  instrumented-tests:
    name: Instrumented tests (SessionStore, ServerConfigStore)
    needs: changes
    if: needs.changes.outputs.android-code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM for hardware-accelerated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # No AVD/snapshot caching on purpose - same call as the Casshole repo,
      # where the two-boot snapshot dance hit a real compatibility bug and the
      # reloaded emulator never left "adb: device offline". A single fresh boot
      # costs ~1 extra minute and works reliably.
      #
      # These tests need a device because EncryptedSharedPreferences goes
      # through the Android keystore and DataStore writes through a Context -
      # neither has a JVM-only path worth faking.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest
