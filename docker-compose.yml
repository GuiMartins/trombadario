services:
  trombadario:
    build: ./backend
    image: trombadario:latest
    container_name: trombadario
    restart: unless-stopped
    ports:
      - "${PORT:-8090}:8000"
    volumes:
      - ./data:/data
    environment:
      # Tudo opcional: sem nenhuma variável o servidor sobe, gera a própria
      # SECRET_KEY e espera você criar a conta do pai pelo navegador.
      SECRET_KEY: ${SECRET_KEY:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-43200}
