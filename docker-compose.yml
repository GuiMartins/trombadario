name: trombadario
services:
  trombadario:
    build: ./backend
    image: ghcr.io/guimartins/trombadario:latest
    container_name: trombadario
    restart: unless-stopped
    ports:
      - "${PORT:-8090}:8000"
    volumes:
      - ./data:/data
    environment:
      # Tudo opcional: sem nenhuma variável o servidor sobe, gera a própria
      # SECRET_KEY e espera você criar a conta do pai pelo navegador.
      SECRET_KEY: ${SECRET_KEY:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-43200}
      # Precisa estar certo, não é enfeite. O painel manda a hora que a pessoa
      # digitou sem fuso nenhum (é o que o <input datetime-local> faz), e o
      # servidor cola o fuso dele - que tem que ser o mesmo da casa. Em UTC, o
      # campo "Quando" já abre 3h à frente e o que é gravado sai 3h errado.
      TZ: ${TZ:-America/Sao_Paulo}

# Sem este bloco o CasaOS instala como "Legacy App": sem ícone, sem nome e sem
# botão de abrir na home do ZimaOS.
x-casaos:
  architectures:
    - amd64
    - arm64
  id: com.guimartins.trombadario
  main: trombadario
  description:
    en_US: Log what your kids get up to. Parent registers, kid reads - on the home network only, with screenshots blocked in the Android app.
    pt_BR: Registro dos acontecimentos do dia a dia como pai. O pai cadastra, o filho visualiza - só na rede de casa, e com print bloqueado no app Android.
  tagline:
    en_US: The house record of what the kids did
    pt_BR: O diário das trombadices lá de casa
  developer: GuiMartins
  author: GuiMartins
  icon: https://raw.githubusercontent.com/GuiMartins/trombadario/main/Apps/trombadario/icon.svg
  thumbnail: ""
  title:
    en_US: Trombadário
  category: Family
  port_map: "8090"
  scheme: http
  index: /
  tips:
    before_install:
      en_US: On first open, the browser walks you through creating the parent account. No environment variables needed.
      pt_BR: No primeiro acesso, o navegador te guia pra criar a conta do pai. Não precisa configurar variável nenhuma.
